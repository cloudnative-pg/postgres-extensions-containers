name: Build and publish SBOM generator

on:
  push:
    branches: [main]
    paths:
      - 'sbom-generator/**'
      - '.github/workflows/sbom-generator.yml'
  pull_request:
    paths:
      - 'sbom-generator/**'
      - '.github/workflows/sbom-generator.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a checked test image to GHCR (never updates latest)"
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # renovate: datasource=docker depName=anchore/grype
  GRYPE_IMAGE: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
  # renovate: datasource=docker depName=anchore/grant
  GRANT_IMAGE: anchore/grant:v0.6.8@sha256:172463611795f43b77302cdfbd7b3f81295492a7330e0820cfe41c3674920237

jobs:
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      generator: ${{ steps.filter.outputs.generator }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for generator changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Compare the complete push, including pushes containing multiple commits.
          base: ${{ github.event.before }}
          filters: |
            generator:
              - 'sbom-generator/**'

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SBOM_SMOKE_PLATFORM: linux/${{ matrix.arch }}
    permissions:
      contents: read
    concurrency:
      group: sbom-generator-check-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    services:
      registry:
        # renovate: datasource=docker depName=registry
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Build local generator
        run: |
          docker buildx build --platform "$SBOM_SMOKE_PLATFORM" \
            --build-arg "SBOM_GENERATOR_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag localhost:5000/cnpg-sbom-generator:check --push sbom-generator

      - name: Run tests in generator image
        run: |
          docker run --rm --platform "$SBOM_SMOKE_PLATFORM" --entrypoint python3 \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            localhost:5000/cnpg-sbom-generator:check \
            -m unittest discover -s sbom-generator/tests -p 'test_*.py'

      - name: Check BuildKit integration and license report
        run: bash sbom-generator/tests/integration/buildkit-smoke.sh localhost:5000/cnpg-sbom-generator:check "$RUNNER_TEMP/sbom-check"

      - name: Save check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-generator-check-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbom-check
          if-no-files-found: ignore

  publish:
    needs: [check, changes]
    # Workflow-only updates (including Grype/Grant bumps) run checks without publishing.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.generator == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: sbom-generator-publish
      cancel-in-progress: false
    services:
      registry:
        # renovate: datasource=docker depName=registry
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select publication destination
        id: destination
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cnpg-sbom-generator" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push ]]; then alias="latest"; else alias="test"; fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Publish or reuse commit image
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: |
          python3 sbom-generator/release.py build \
            --image "$IMAGE" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/sbom-release"

      - name: Check published digest with BuildKit
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: |
          digest=$(cat "$RUNNER_TEMP/sbom-release/digest")
          bash sbom-generator/tests/integration/buildkit-smoke.sh "$IMAGE@$digest" "$RUNNER_TEMP/sbom-release/smoke"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checked generator image
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: cosign sign --yes "$IMAGE@$(cat "$RUNNER_TEMP/sbom-release/digest")"

      - name: Promote checked digest
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          ALIAS: ${{ steps.destination.outputs.alias }}
        run: |
          python3 sbom-generator/release.py promote \
            --image "$IMAGE" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/sbom-release" --alias "$ALIAS"

      - name: Summarize publication
        if: always()
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          ALIAS: ${{ steps.destination.outputs.alias }}
        run: |
          {
            echo '## SBOM generator publication'
            echo "Source: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo 'Smoke-test architecture: linux/amd64; published platforms: linux/amd64 and linux/arm64.'
            if [[ -f "$RUNNER_TEMP/sbom-release/digest" ]]; then
              digest=$(cat "$RUNNER_TEMP/sbom-release/digest")
              echo "Commit artifact: \`$IMAGE:sha-$GITHUB_SHA@$digest\`"
              if [[ -f "$RUNNER_TEMP/sbom-release/promotion.json" ]] && jq -e '.promoted' "$RUNNER_TEMP/sbom-release/promotion.json" > /dev/null; then
                echo "Promoted reference: \`$IMAGE:$ALIAS@$digest\`"
              else
                echo "Alias $ALIAS was not promoted by this run. Check the job logs before using this artifact."
              fi
            fi
            echo "[Logs and evidence](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-generator-publication
          path: ${{ runner.temp }}/sbom-release
          if-no-files-found: ignore
