apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: (join('-', [$values.name, 'app']))
spec:
  name: app
  owner: app
  cluster:
    name: ($values.name)
  extensions:
  - name: ($values.sql_name)
    version: ($values.version)
  - name: postgis_raster
    version: ($values.version)
  - name: postgis_sfcgal
    version: ($values.version)
  - name: fuzzystrmatch
  - name: postgis_topology
    version: ($values.version)
